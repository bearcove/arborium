[package]
name = "arborium"
version = "1.0.11"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bearcove/arborium"
description = "Tree-sitter syntax highlighting with HTML rendering and WASM support"
keywords = ["tree-sitter", "syntax-highlighting", "wasm"]
categories = ["parsing", "text-processing", "wasm"]
links = "arborium"

[features]
default = []

# All languages
all-languages = [
    "lang-python",
]

# Individual language features
lang-python = ["dep:arborium-python"]

[dependencies]
arborium-tree-sitter = { version = "1.0.11", path = "../arborium-tree-sitter" }
arborium-theme = { version = "1.0.11", path = "../arborium-theme" }
arborium-highlight = { version = "1.0.11", path = "../arborium-highlight", features = ["tree-sitter"] }

# Optional grammar dependencies
arborium-python = { version = "1.0.11", path = "../../langs/group-hazel/python/crate", optional = true }

[dev-dependencies]
indoc = "2"

# WASM allocator (automatically enabled on wasm targets)
[target.'cfg(target_family = "wasm")'.dependencies]
dlmalloc = "0.2"
