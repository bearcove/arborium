[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
camino = "1"
chrono = "0.4"
fs-err = "3"
which = "7"
facet = { version = "0.50.0-rc.7", features = ["indexmap"] }
figue = "5.0.0-rc.6"
facet-json = "0.50.0-rc.7"
facet-yaml = "0.50.0-rc.7"
facet-toml = "0.50.0-rc.7"
indexmap = { version = "2", features = ["std"] }
thiserror = "2"
structstruck = "0.4"
rootcause = "0.10"
tiny_http = "0.12"
indicatif = "0.17"
owo-colors = "4"
rayon = "1.10"
tempfile = "3"
regex = "1"
blake3 = "1"

tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
sailfish = "0.10"
rand = "0.9.2"
toml = "0.8"
walkdir = "2"
flate2 = "1"
tar = "0.4"
brotli = "7"

# NOTE: xtask does NOT depend on arborium-theme - it parses theme TOML files directly
# This avoids circular dependency since arborium-theme/Cargo.toml is generated
toml_edit = "0.23.9"
serde_json = "1.0.145"
walrus = "0.20"
petgraph = "0.7"
