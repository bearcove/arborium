grammars:
  - id: kconfig
    name: Kconfig
    tag: config
    tier: 2
    has_scanner: true

    inventor: Linus Torvalds
    year: 2005
    description: A tree-based configuration language originally designed for the kernel, now used by many projects.
    link: https://docs.kernel.org/kbuild/kconfig-language.html

    samples:
      - path: samples/Kconfig
        link: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/tree/init/Kconfig
        license: GPL-2.0-only
