repo: https://github.com/tree-sitter/tree-sitter-jsdoc
commit: 658d18dcdddb75c760363faa4963427a7c6b52db
license: MIT

grammars:
  - id: jsdoc
    name: JSDoc
    tag: code
    tier: 1
    has_scanner: true

    injections:
      - regex
      - jsdoc

    inventor: Michael Mathews
    year: 1999
    description: "An API documentation generator for JavaScript."
    link: https://jsdoc.app/

    samples:
      - path: samples/sample.jsdoc
        description: Comment from crates/arborium-tree-sitter/binding_web/src/node.ts
        license: MIT OR Apache-2.0
